<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="social-lib — Banner plus profile and social images">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0d1117"/>
			<stop offset="1" stop-color="#090c13"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.1" cy="0.05" r="0.55">
			<stop offset="0" stop-color="#8b95a7" stop-opacity="0.15"/>
			<stop offset="1" stop-color="#8b95a7" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glow2" cx="0.92" cy="1" r="0.5">
			<stop offset="0" stop-color="#6e7bff" stop-opacity="0.12"/>
			<stop offset="1" stop-color="#6e7bff" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="400" height="400" fill="url(#bg)"/>
	<rect width="400" height="400" fill="url(#glow)"/>
	<rect width="400" height="400" fill="url(#glow2)"/>

	<!-- Logo mark: brand/favicon.svg — edit that file to change it on every canvas. -->
	<image href="favicon.svg" x="80" y="80" width="240" height="240"/>
</svg>
