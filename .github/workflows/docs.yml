name: 📚 Docs
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs.yml'
  # The changelog page is built from GitHub Releases. A release created with
  # GITHUB_TOKEN never fires `release: published`, so rebuild once CI (which
  # runs semantic-release) succeeds on main instead — no PAT needed.
  workflow_run:
    workflows: ['🚀 CI/CD Pipeline']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    uses: rtorcato/repo-tooling/.github/workflows/docs-deploy-cloudflare.yml@main
    with:
      build-filter: '@rtorcato/brand-kit-docs'
      worker-name: brand-kit-docs
      base-path: /brand-kit/
      route: docs.torcato.dev/brand-kit/*
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
