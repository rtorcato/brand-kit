name: Docs

on:
  push:
    branches: [main]
    # src/** and README.md so a shipped change redeploys, not just edits under apps/docs.
    paths:
      - 'apps/docs/**'
      - 'src/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  # release.yml dispatches this after a publish, so the changelog page (built
  # from the GitHub releases) picks up the new ones.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # https://docs.torcato.dev/brand-kit/
  cloudflare:
    permissions:
      contents: read
    uses: rtorcato/repo-tooling/.github/workflows/docs-deploy-cloudflare.yml@v5.1.4
    with:
      build-filter: '@rtorcato/brand-kit-docs'
      worker-name: brand-kit-docs
      base-path: /brand-kit/
      route: docs.torcato.dev/brand-kit/*
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
