name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Four jobs rather than one, named to match the family standard's required
# status checks (lint, typecheck, build, test) so branch protection can require
# them by name.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Steps of `build` rather than a fifth job: branch protection requires the
      # four check names, so a new job could fail without blocking anything.
      - name: Validate the published package (publint)
        run: pnpm publint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # renderBrand and packIco shell out to rsvg-convert.
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      # Tests import dist/, so they need the build even though `build` is a
      # separate job — cheaper than passing artifacts between two short jobs.
      - run: pnpm build
      - run: pnpm test
      # Node 24 as extra steps of `test` (not a matrix: a matrix renames the
      # required check). Node 22 EOLs 2027-04-30.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm build
      - run: pnpm test

  # Fails a PR that changes published source without a changeset. Same logic as the
  # repo-tooling preset's `changeset` job, added by hand so the rest of this file stays.
  changeset:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Require a changeset for published source
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$PR_TITLE" | grep -Eq '^(docs|chore|ci|test|build|style|refactor)(\([^)]*\))?:'; then
            echo "Skipped: the PR title's type releases nothing"
            exit 0
          fi
          if ! git diff --name-only HEAD^1 HEAD | grep -Eq '^(src|packages/[^/]+/src)/'; then
            echo "No published source changed"
            exit 0
          fi
          if git diff --name-only --diff-filter=A HEAD^1 HEAD -- '.changeset/*.md' | grep -qv '^\.changeset/README\.md$'; then
            echo "Changeset found"
            exit 0
          fi
          echo "::error::This PR changes published source but adds no changeset. Run 'pnpm changeset' and commit the file, or 'pnpm changeset --empty' if it releases nothing."
          exit 1

  # The single required check. Branch protection requires only `ci`, so adding a job or
  # changing the Node matrix never touches protection again. Skipped jobs pass; a failed
  # or cancelled one fails the gate.
  ci:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test, changeset]
    if: always()
    permissions: {}
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]
