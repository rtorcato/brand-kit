packages:
  - 'apps/*'

minimumReleaseAgeExclude:
  - '@rtorcato/*'

# Don't re-verify node_modules on every script run — the check costs a
# second per invocation and CI installs with --frozen-lockfile anyway.
verifyDepsBeforeRun: false

allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  sharp: true
